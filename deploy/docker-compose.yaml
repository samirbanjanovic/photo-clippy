# Photo Clippy: a web UI for exploring your photo habits and ranking candidate lenses.
#
#   cp .env.example .env        # set CLIPPY_LIBRARY (required) and anything else you want to change
#   docker compose up -d        # builds the image from this repository on first start
#   docker compose logs photo-clippy | grep 'setup code'
#
# Then open http://<host>:8080 and create the first admin with the setup code. Everything else is configured
# in Settings and saved to /data/photo-clippy.json. To run behind Traefik, add docker-compose.traefik.yaml
# (see .env.example). To run an image you pushed with publish-image.sh, set CLIPPY_IMAGE.

name: photo-clippy

services:
  photo-clippy:
    image: ${CLIPPY_IMAGE:-photo-clippy:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    pull_policy: ${CLIPPY_PULL_POLICY:-missing}
    container_name: photo-clippy
    restart: unless-stopped
    # 1654 is the image's own non-root user. For bind-mounted data, set PUID/PGID to the owner of CLIPPY_DATA.
    user: "${PUID:-1654}:${PGID:-1654}"
    ports:
      - "${CLIPPY_PORT:-8080}:8080"
    volumes:
      # Read-only. Settings → Library can pick any folder below /photos; on first start all of /photos is scanned.
      - ${CLIPPY_LIBRARY:?set CLIPPY_LIBRARY to your photo folder (see .env.example)}:/photos:ro
      # Config written by the UI, analysis cache, models, reports, accounts and session keys.
      - ${CLIPPY_DATA:-photo-clippy-data}:/data
    environment:
      - TZ=${TZ:-UTC}
      # Any PHOTO_CLIPPY_* setting placed here overrides the config file and shows as locked in the UI, e.g.
      # - PHOTO_CLIPPY_SERVE__RESCANHOURS=24
      # - PHOTO_CLIPPY_PLUGINS__METADATA__1=builtin.metadata.exiftool
      # - PHOTO_CLIPPY_AUTH__ADMINS__0=alice
      # - PHOTO_CLIPPY_AUTH__SESSIONHOURS=24
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  photo-clippy-data:
